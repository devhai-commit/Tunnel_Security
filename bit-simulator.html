<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multi-Node Frame Simulator – Tunnel Security</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#020817; color:#e2e8f0; font-family:'Cascadia Code','Fira Code',Consolas,monospace; }
  ::-webkit-scrollbar{width:5px;height:5px}
  ::-webkit-scrollbar-track{background:#0f172a}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}

  /* ── Controls ─────────────────────── */
  .ci { background:#1e293b; border:1px solid #334155; color:#e2e8f0; padding:3px 7px;
        border-radius:4px; font-family:inherit; font-size:.72rem; }
  .ci:focus { outline:none; border-color:#3b82f6; }
  .btn { padding:5px 10px; border-radius:5px; font-size:.72rem; font-weight:700;
         cursor:pointer; border:0; transition:all .12s; }

  /* ── Node grid ────────────────────── */
  #nodeGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
              gap:10px; padding:10px; align-content:start; }

  .nc { background:#0f172a; border:1px solid #1e293b; border-radius:8px;
        padding:10px; transition:border-color .2s, box-shadow .2s;
        border-left-width:3px; border-left-style:solid; }
  .nc.running { border-color:#1d4ed8; }
  .nc.flashing { box-shadow:0 0 0 3px rgba(59,130,246,.45); }

  /* ── Sensor value pills ────────────── */
  .sv-row { display:grid; grid-template-columns:1fr 1fr; gap:1px 8px; font-size:.68rem; }
  .sv-key { color:#475569; }
  .sv-val { font-weight:700; text-align:right; }

  /* ── Bit stream ───────────────────── */
  .bs-bit { flex-shrink:0; display:inline-flex; align-items:center; justify-content:center;
            width:10px; height:20px; font-size:.52rem; font-weight:700; border-radius:1px; }
  .bs-sep { flex-shrink:0; width:3px; height:20px; border-radius:1px; margin:0 2px; }

  /* ── Log ──────────────────────────── */
  .le { padding:1px 10px; border-bottom:1px solid #0c1524; font-size:.68rem;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ── Modal ────────────────────────── */
  #editModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75);
               z-index:60; align-items:center; justify-content:center; }
  #editModal.open { display:flex; }
  #editModal .mpanel { background:#0f172a; border:1px solid #334155; border-radius:12px;
                        width:100%; max-width:520px; max-height:88vh; overflow-y:auto; padding:16px; }

  /* ── Frame table ──────────────────── */
  .ft td { border:1px solid #0c1524; text-align:center; }
  .ft-f  { font-size:.6rem;  font-weight:700; padding:3px 1px; white-space:nowrap; }
  .ft-h  { font-size:.72rem; font-weight:700; padding:3px 2px; min-width:30px; cursor:pointer; }
  .ft-h:hover { filter:brightness(1.6); }
  .ft-b  { font-size:.55rem; padding:2px; min-width:30px; letter-spacing:.5px; }

  /* Slider */
  input[type="range"] { accent-color:#3b82f6; }

  /* Pulse for running dot */
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .pulsing { animation:pulse 1.5s infinite; }
</style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

<!-- ═══ HEADER ════════════════════════════════════════════════════════════ -->
<header class="bg-slate-900 border-b border-slate-700 px-4 py-2 flex flex-wrap items-center gap-x-4 gap-y-1.5 flex-shrink-0">

  <!-- Branding -->
  <div class="flex items-center gap-2 flex-shrink-0">
    <div class="w-7 h-7 rounded bg-blue-700 flex items-center justify-center text-white font-bold text-xs">MN</div>
    <span class="font-bold text-sm">Multi-Node Simulator</span>
  </div>

  <!-- Backend -->
  <div class="flex items-center gap-1.5">
    <label class="text-xs text-slate-500">Backend</label>
    <input id="inp-host" type="text" value="localhost:5050" class="ci w-36"
           autocomplete="off" spellcheck="false"
           oninput="applyBackendHost(this.value)"
           onchange="applyBackendHost(this.value)"
           onkeydown="if(event.key==='Enter')event.preventDefault()"/>
    <button type="button" class="btn" style="background:#0c2a47;color:#60a5fa" onclick="fetchNodes()">⟳ Fetch</button>
    <button type="button" class="btn" style="background:#1e293b;color:#94a3b8" onclick="loadDefaultNodes()">📋 Defaults</button>
  </div>

  <!-- Mode + Interval + Drift -->
  <div class="flex items-center gap-1.5">
    <label class="text-xs text-slate-500">Mode</label>
    <select id="sel-mode" class="ci" onchange="localStorage.setItem('sim-mode',this.value)">
      <option value="ws">WebSocket (binary)</option>
      <option value="http">HTTP REST</option>
    </select>
    <label class="text-xs text-slate-500">Interval</label>
    <input id="inp-interval" type="number" value="1000" min="200" max="10000" step="100" class="ci w-20"
           oninput="localStorage.setItem('sim-interval',this.value)"
           onkeydown="if(event.key==='Enter')event.preventDefault()"/>
    <span class="text-xs text-slate-600">ms</span>
    <label class="flex items-center gap-1 cursor-pointer ml-1">
      <input id="chk-drift" type="checkbox" class="accent-blue-500" checked/>
      <span class="text-xs text-slate-400">Drift</span>
    </label>
  </div>

  <!-- Global actions -->
  <div class="flex gap-1.5 flex-shrink-0">
    <button type="button" class="btn" style="background:#14532d;color:#86efac" onclick="startAll()">▶ Start All</button>
    <button type="button" class="btn" style="background:#7f1d1d;color:#fca5a5" onclick="stopAll()">■ Stop All</button>
    <button type="button" class="btn" style="background:#1e293b;color:#cbd5e1" onclick="randomizeAll()">🎲 Rnd All</button>
  </div>

  <!-- Stats -->
  <div class="flex items-center gap-2 ml-auto text-xs text-slate-500 flex-shrink-0">
    <div id="statDot" class="w-2 h-2 rounded-full bg-slate-600"></div>
    <span id="statLabel">0 active</span>
    <span class="text-slate-700">|</span>
    <span id="statFrames" class="text-white font-bold">0</span>
    <span>frames</span>
    <span class="text-slate-700">|</span>
    <span id="statBits" class="text-blue-400">0 bits</span>
  </div>
</header>

<!-- ═══ NODE GRID (scrollable) ════════════════════════════════════════════ -->
<div class="flex-1 overflow-y-auto min-h-0">
  <div id="nodeGrid">
    <!-- Empty state -->
    <div id="emptyState" style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#334155">
      <div style="font-size:2.5rem;margin-bottom:8px">📡</div>
      <div style="font-size:.85rem;margin-bottom:4px">Chưa có node nào được tải</div>
      <div style="font-size:.72rem;margin-bottom:16px;color:#1e3a5f">Nhấn "Fetch" để lấy từ backend hoặc "Defaults" để dùng danh sách mặc định</div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button type="button" class="btn" style="background:#1d4ed8;color:#fff" onclick="fetchNodes()">⟳ Fetch from Backend</button>
        <button type="button" class="btn" style="background:#1e293b;color:#93c5fd" onclick="loadDefaultNodes()">📋 Load Default Nodes</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ BIT STREAM ════════════════════════════════════════════════════════ -->
<div class="flex-shrink-0 bg-slate-950 border-t border-slate-800 px-3 py-1.5" style="height:48px">
  <div class="flex items-center justify-between mb-0.5">
    <div class="flex items-center gap-2">
      <span class="text-xs text-slate-600 font-semibold uppercase tracking-wider">Bit Stream</span>
      <span id="bsInfo" class="text-xs text-slate-700"></span>
    </div>
    <button type="button" class="text-xs text-slate-700 hover:text-slate-500 transition" onclick="clearBs()">Clear</button>

<!-- ═══ LOG ═══════════════════════════════════════════════════════════════ -->
<div class="flex-shrink-0 bg-slate-900 border-t border-slate-700 flex flex-col" style="height:110px">
  <div class="flex items-center justify-between px-3 py-1 border-b border-slate-800 flex-shrink-0">
    <span class="text-xs text-slate-500 font-semibold uppercase tracking-wider">Transmission Log</span>
    <button type="button" class="text-xs text-slate-600 hover:text-slate-400 transition" onclick="clearLog()">Clear</button>
  </div>
  <div id="logContainer" class="flex-1 overflow-y-auto font-mono"></div>
</div>

<!-- ═══ EDIT MODAL ════════════════════════════════════════════════════════ -->
<div id="editModal">
  <div class="mpanel">
    <!-- Modal header -->
    <div class="flex items-center justify-between mb-3">
      <div>
        <div id="mdlTitle" class="font-bold text-sm text-blue-400">NODE-XXX</div>
        <div id="mdlSub" class="text-xs text-slate-500"></div>
      </div>
      <div class="flex items-center gap-2">
        <div id="mdlDot" class="w-2 h-2 rounded-full bg-slate-600"></div>
        <button type="button" id="mdlToggleBtn" class="btn" style="background:#1d4ed8;color:#fff" onclick="toggleModalNode()">▶ Start</button>
        <button type="button" class="btn" style="background:#1e293b;color:#94a3b8" onclick="randomizeModalNode()">🎲 Rnd</button>
        <button type="button" onclick="closeModal()" class="text-slate-500 hover:text-white text-lg leading-none ml-1">✕</button>
      </div>
    </div>

    <!-- Per-node interval -->
    <div class="flex items-center gap-2 mb-3 text-xs">
      <label class="text-slate-500">Node interval</label>
      <input id="mdlInterval" type="number" value="1000" min="200" max="10000" step="100" class="ci w-20"
             oninput="updateModalInterval(this.value)"
             onkeydown="if(event.key==='Enter')event.preventDefault()"/>
      <span class="text-slate-600">ms</span>
    </div>

    <!-- Sliders -->
    <div id="mdlSliders" class="space-y-3"></div>

    <!-- Frame preview -->
    <div class="mt-4">
      <div class="text-xs text-slate-600 font-semibold uppercase tracking-wider mb-1.5">Frame Preview (32 bytes)</div>
      <div class="overflow-x-auto">
        <table id="mdlFT" class="ft border-collapse"></table>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  FRAME SCHEMA  (32-byte binary protocol)
// ═══════════════════════════════════════════════════════════════

const FIELDS = [
  {id:'start',  s:0,  l:1, type:'fixed',   fv:0xAA, lbl:'START',  bg:'#1f2937',fg:'#9ca3af'},
  {id:'header', s:1,  l:1, type:'fixed',   fv:0x01, lbl:'HDR',    bg:'#2e1065',fg:'#a78bfa'},
  {id:'temp',   s:2,  l:4, type:'float32',          lbl:'TEMP',   bg:'#064e3b',fg:'#34d399'},
  {id:'hum',    s:6,  l:4, type:'float32',          lbl:'HUM',    bg:'#052e16',fg:'#6ee7b7'},
  {id:'light',  s:10, l:4, type:'float32',          lbl:'LIGHT',  bg:'#422006',fg:'#fde68a'},
  {id:'dist',   s:14, l:4, type:'float32',          lbl:'DIST',   bg:'#0c1a2e',fg:'#93c5fd'},
  {id:'speed',  s:18, l:4, type:'float32',          lbl:'SPEED',  bg:'#1e1b4b',fg:'#a5b4fc'},
  {id:'energy', s:22, l:4, type:'uint32',           lbl:'ENERGY', bg:'#4a044e',fg:'#f0abfc'},
  {id:'height', s:26, l:2, type:'uint16',           lbl:'HEIGHT', bg:'#431407',fg:'#fdba74'},
  {id:'crc',    s:28, l:2, type:'crc16',            lbl:'CRC',    bg:'#450a0a',fg:'#fca5a5'},
  {id:'rsv',    s:30, l:1, type:'fixed',   fv:0x00, lbl:'RSV',    bg:'#111827',fg:'#374151'},
  {id:'stop',   s:31, l:1, type:'fixed',   fv:0xBB, lbl:'STOP',   bg:'#1f2937',fg:'#9ca3af'},
];
const BYTE_FIELD = new Array(32);
FIELDS.forEach(f => { for(let i=f.s;i<f.s+f.l;i++) BYTE_FIELD[i]=f; });

// Sensor field definitions for slider UI
const SEN_DEFS = [
  {id:'temp',   lbl:'Nhiệt độ',     unit:'°C',  min:-10, max:80,    step:0.1,  dft:25.0,  int:false},
  {id:'hum',    lbl:'Độ ẩm',        unit:'%',   min:0,   max:100,   step:0.1,  dft:60.0,  int:false},
  {id:'light',  lbl:'Ánh sáng',     unit:'lux', min:0,   max:10000, step:1,    dft:200,   int:false},
  {id:'dist',   lbl:'K.cách Radar', unit:'m',   min:0,   max:10,    step:0.01, dft:0.5,   int:false},
  {id:'speed',  lbl:'Tốc độ Radar', unit:'m/s', min:0,   max:30,    step:0.01, dft:0.0,   int:false},
  {id:'energy', lbl:'Năng lượng',   unit:'',    min:0,   max:65535, step:1,    dft:1000,  int:true},
  {id:'height', lbl:'Độ cao VL53',  unit:'mm',  min:0,   max:4000,  step:1,    dft:100,   int:true},
];

// Sensor ID suffix that exists in the DB (matches MockData.cs)
const DB_SENSORS = {
  temp:  'TEMP',
  hum:   'HUM',
  dist:  'RADAR',
  speed: 'VIB',
  // height → 'WATER' only if node has that sensor; we'll try and log fail gracefully
};

// Per-node accent colors (used in bit stream + card border)
const COLORS = [
  '#60a5fa','#34d399','#f472b6','#fbbf24','#a78bfa',
  '#f87171','#fb923c','#6ee7b7','#93c5fd','#e879f9',
  '#4ade80','#38bdf8','#c084fc','#fda4af',
];

// Default nodes (matches MockData.cs seeded data)
const DEFAULT_NODES = [
  {id:'NODE-L0-01',name:'Hub – Ngã tư Cầu Giấy'},
  {id:'NODE-L1-01',name:'Cống Xuân Thủy 1'},
  {id:'NODE-L1-02',name:'Cống Xuân Thủy 2'},
  {id:'NODE-L1-03',name:'Cống Xuân Thủy 3'},
  {id:'NODE-L2-01',name:'Cống Cầu Giấy 1'},
  {id:'NODE-L2-02',name:'Cống Cầu Giấy 2'},
  {id:'NODE-L2-03',name:'Cống Cầu Giấy 3'},
  {id:'NODE-L3-01',name:'Cống Trần Thái Tông 1'},
  {id:'NODE-L3-02',name:'Cống Trần Thái Tông 2'},
  {id:'NODE-L3-03',name:'Cống Trần Thái Tông 3'},
];

// ═══════════════════════════════════════════════════════════════
//  GLOBAL STATE
// ═══════════════════════════════════════════════════════════════

// Backend host – JS variable is the single source of truth.
// inp-host input only reflects this value; never read DOM for host.
let backendHost = localStorage.getItem('sim-backend-host') || 'localhost:5050';

function applyBackendHost(val) {
  backendHost = val.trim() || 'localhost:5050';
  localStorage.setItem('sim-backend-host', backendHost);
  const el = document.getElementById('inp-host');
  if (el && el.value !== backendHost) el.value = backendHost;
}

const nodeMap   = new Map();  // nodeId → NodeSim
let totalFrames = 0;
let totalBits   = 0;
let colorIdx    = 0;
let modalId     = null;       // currently open modal's nodeId
let mdlFTBuilt  = false;      // modal frame table already has structure

// ═══════════════════════════════════════════════════════════════
//  NodeSim CLASS
// ═══════════════════════════════════════════════════════════════

class NodeSim {
  constructor(id, name, color) {
    this.id       = id;
    this.name     = name;
    this.color    = color;
    this.active   = false;
    this.timer    = null;
    this.ws       = null;
    this.wsState  = 'off';   // 'off'|'connecting'|'open'|'error'
    this.frames   = 0;
    this.lastCrc  = null;
    this.interval = parseInt(document.getElementById('inp-interval').value) || 1000;
    this.values   = this._randValues();
  }

  // Slightly different default per node
  _randValues() {
    const r = Math.random;
    return {
      temp:   +(18 + r()*20).toFixed(1),
      hum:    +(40 + r()*55).toFixed(1),
      light:  +(r()*6000).toFixed(0),
      dist:   +(r()*6).toFixed(2),
      speed:  +(r()*12).toFixed(2),
      energy: Math.floor(r()*50000),
      height: Math.floor(50 + r()*2000),
    };
  }

  // Gentle random drift – simulates live sensor noise
  _drift() {
    const d = (v, lo, hi, pct) => Math.max(lo, Math.min(hi, v + (Math.random()-.5)*2*pct*(hi-lo)));
    this.values.temp   = +d(this.values.temp,  -10, 80,   0.02).toFixed(1);
    this.values.hum    = +d(this.values.hum,     0, 100,  0.015).toFixed(1);
    this.values.light  = +d(this.values.light,   0, 10000,0.04).toFixed(0);
    this.values.dist   = +d(this.values.dist,    0, 10,   0.02).toFixed(2);
    this.values.speed  = +d(this.values.speed,   0, 30,   0.05).toFixed(2);
    this.values.energy = Math.max(0, Math.min(65535, this.values.energy + Math.floor((Math.random()-.5)*200)));
    this.values.height = Math.max(0, Math.min(4000,  this.values.height + Math.floor((Math.random()-.5)*20)));
  }

  buildFrame() {
    const buf   = new ArrayBuffer(32);
    const view  = new DataView(buf);
    const bytes = new Uint8Array(buf);
    bytes[0] = 0xAA; bytes[1] = 0x01;
    view.setFloat32(2,  this.values.temp,   true);
    view.setFloat32(6,  this.values.hum,    true);
    view.setFloat32(10, this.values.light,  true);
    view.setFloat32(14, this.values.dist,   true);
    view.setFloat32(18, this.values.speed,  true);
    view.setUint32(22,  this.values.energy, true);
    view.setUint16(26,  this.values.height, true);
    const crc = crc16(bytes, 0, 28);
    view.setUint16(28, crc, true);
    bytes[30] = 0x00; bytes[31] = 0xBB;
    return bytes;
  }

  async start() {
    if (this.active) return;
    this.active   = true;
    this.interval = parseInt(document.getElementById('inp-interval').value) || 1000;

    if (document.getElementById('sel-mode').value === 'ws') {
      await this._connectWs();
    }

    if (!this.active) return;  // stop() was called while awaiting WS

    redrawCard(this); updateStats();
    this._loop();
  }

  // Recursive setTimeout loop – waits for each send() to finish before
  // scheduling the next tick, so sends never overlap even over slow HTTP.
  // try-catch ensures an individual send failure never breaks the loop.
  async _loop() {
    if (!this.active) return;
    try {
      await this.send();
    } catch (err) {
      addLog(`${this.id}  send error: ${err.message}`, 'err', this.color);
    }
    if (this.active) {
      this.timer = setTimeout(() => this._loop(), this.interval);
    }
  }

  stop() {
    this.active = false;
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    if (this.ws)    { try { this.ws.close(); } catch(_){} this.ws = null; }
    this.wsState = 'off';
    redrawCard(this); updateStats();
  }

  async _connectWs() {
    // Close any stale connection before opening a new one
    if (this.ws) {
      const stale = this.ws;
      this.ws = null;
      try { stale.close(); } catch(_) {}
    }

    const host = backendHost;
    const url  = `ws://${host}/ws/device?nodeId=${encodeURIComponent(this.id)}`;
    this.wsState = 'connecting';

    return new Promise(resolve => {
      const to = setTimeout(resolve, 3000); // 3s timeout
      try {
        const s = new WebSocket(url);
        s.binaryType = 'arraybuffer';
        s.onopen = () => {
          clearTimeout(to);
          if (this.active) {
            this.ws = s;
            this.wsState = 'open';
          } else {
            // Node was stopped while connecting — discard the new socket
            try { s.close(); } catch(_) {}
          }
          resolve();
        };
        s.onclose = () => {
          // Guard: ignore events from stale sockets that are no longer current
          if (this.ws !== s) return;
          this.ws = null;
          if (this.active) {
            this.wsState = 'error';
            // Auto-reconnect after 2 s so the loop keeps running over WS
            setTimeout(() => {
              if (this.active) {
                this._connectWs().then(() => redrawCard(this));
              }
            }, 2000);
          }
        };
        s.onerror = () => { clearTimeout(to); this.wsState = 'error'; resolve(); };
      } catch(e) { clearTimeout(to); this.wsState = 'error'; resolve(); }
    });
  }

  async send() {
    // Apply drift if enabled
    if (document.getElementById('chk-drift').checked) this._drift();

    const frame  = this.buildFrame();
    const crcVal = (frame[29] << 8) | frame[28];
    this.lastCrc = `0x${crcVal.toString(16).toUpperCase().padStart(4,'0')}`;
    this.frames++;
    totalFrames++;
    totalBits += 256;

    const mode = document.getElementById('sel-mode').value;
    let wsSent = false;
    if (mode === 'ws' && this.ws && this.ws.readyState === WebSocket.OPEN) {
      try {
        this.ws.send(frame.buffer);
        wsSent = true;
        addLog(`${this.id}  #${this.frames} → WS  32B  CRC=${this.lastCrc}`+
               `  T=${this.values.temp}°C  H=${this.values.hum}%`+
               `  D=${this.values.dist}m  S=${this.values.speed}m/s  Ht=${this.values.height}mm`,
               'ws', this.color);
      } catch (_) {
        this.ws = null; this.wsState = 'error';
      }
    }
    if (!wsSent) {
      await this._sendHttp(frame);
    }

    pushBits(frame, this);
    redrawCard(this);
    updateStats();

    // Keep modal in sync if this node is open
    if (modalId === this.id) syncModalValues();
  }

  async _sendHttp(frame) {
    const base = `http://${backendHost}/api/sensors`;
    const dv   = new DataView(frame.buffer);

    const sensors = [
      {id:`${this.id}-TEMP`,  v: dv.getFloat32(2,  true)},
      {id:`${this.id}-HUM`,   v: dv.getFloat32(6,  true)},
      {id:`${this.id}-RADAR`, v: dv.getFloat32(14, true)},
      {id:`${this.id}-VIB`,   v: dv.getFloat32(18, true)},
      {id:`${this.id}-WATER`, v: dv.getUint16(26,  true)},
    ];

    const res = await Promise.allSettled(sensors.map(s =>
      fetch(`${base}/${s.id}/measurements`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({value:s.v})
      }).then(r => r.ok ? 'ok' : 'fail')
    ));

    const ok = res.filter(r => r.status==='fulfilled' && r.value==='ok').length;
    addLog(`${this.id}  #${this.frames} → HTTP  ${ok}/${sensors.length} OK  CRC=${this.lastCrc}`,
           ok < sensors.length ? 'err' : 'http', this.color);
  }

  randomize() { this.values = this._randValues(); redrawCard(this); if (modalId===this.id) syncModalFull(); }
}

// ═══════════════════════════════════════════════════════════════
//  CRC-16 / CCITT-FALSE  (seed=0xFFFF, poly=0x1021)
// ═══════════════════════════════════════════════════════════════

function crc16(data, off, len) {
  let crc = 0xFFFF;
  for (let i = off; i < off + len; i++) {
    crc ^= ((data[i] & 0xFF) << 8);
    for (let j = 0; j < 8; j++)
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
  }
  return crc;
}

// ═══════════════════════════════════════════════════════════════
//  NODE MANAGEMENT
// ═══════════════════════════════════════════════════════════════

async function fetchNodes() {
  applyBackendHost(document.getElementById('inp-host').value);
  addLog(`Fetching nodes from http://${backendHost}/api/stations …`, 'inf', null);
  try {
    const resp = await fetch(`http://${backendHost}/api/stations`, {signal: AbortSignal.timeout(5000)});
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data     = await resp.json();
    const stations = Array.isArray(data) ? data : [data];
    const seen     = new Set();
    const list     = [];
    for (const st of stations)
      for (const ln of (st.lines || []))
        for (const nd of (ln.nodes || []))
          if (!seen.has(nd.id)) { seen.add(nd.id); list.push({id:nd.id, name:nd.name||nd.id}); }

    if (!list.length) throw new Error('Response has no nodes');
    addLog(`Loaded ${list.length} nodes from backend`, 'inf', null);
    populateNodes(list);
  } catch(e) {
    addLog(`Fetch failed: ${e.message}  →  use "Defaults" button`, 'err', null);
  }
}

function loadDefaultNodes() {
  populateNodes(DEFAULT_NODES);
  addLog(`Loaded ${DEFAULT_NODES.length} default nodes`, 'inf', null);
}

function populateNodes(list) {
  nodeMap.forEach(n => n.stop());
  nodeMap.clear();
  colorIdx  = 0;
  mdlFTBuilt = false;
  closeModal();

  document.getElementById('emptyState').style.display = 'none';
  document.querySelectorAll('.nc').forEach(el => el.remove());

  list.forEach(n => {
    const color = COLORS[colorIdx++ % COLORS.length];
    const sim   = new NodeSim(n.id, n.name, color);
    nodeMap.set(n.id, sim);
    document.getElementById('nodeGrid').appendChild(buildCard(sim));
  });

  updateStats();
}

// ═══════════════════════════════════════════════════════════════
//  NODE CARD DOM
// ═══════════════════════════════════════════════════════════════

function buildCard(sim) {
  const div   = document.createElement('div');
  div.id      = `card-${sim.id}`;
  div.className = 'nc';
  div.style.borderLeftColor = sim.color;
  div.innerHTML = cardHTML(sim);
  return div;
}

function redrawCard(sim) {
  const el = document.getElementById(`card-${sim.id}`);
  if (!el) return;
  el.className = `nc${sim.active ? ' running' : ''}`;
  el.innerHTML = cardHTML(sim);

  if (sim.active) {
    el.classList.add('flashing');
    setTimeout(() => el.classList.remove('flashing'), 350);
  }
}

function cardHTML(sim) {
  const v      = sim.values;
  const on     = sim.active;
  const dotClr = on ? sim.color : '#475569';
  const btnBg  = on ? '#7f1d1d' : '#1d4ed8';
  const btnClr = on ? '#fca5a5' : '#fff';
  const btnTxt = on ? '■ Stop' : '▶ Start';
  const wsTag  = sim.wsState === 'open' ? '<span style="color:#22c55e;font-size:.55rem">WS</span>' :
                 sim.wsState === 'connecting' ? '<span style="color:#fbbf24;font-size:.55rem">WS…</span>' :
                 sim.wsState === 'error' ? '<span style="color:#ef4444;font-size:.55rem">WS!</span>' : '';
  return `
    <div class="flex items-start justify-between mb-2">
      <div style="min-width:0">
        <div class="text-xs font-bold truncate" style="color:${sim.color}">${sim.id}</div>
        <div class="text-xs truncate" style="color:#475569;max-width:150px">${sim.name}</div>
      </div>
      <div class="flex items-center gap-1 flex-shrink-0 ml-1 pt-0.5">
        ${wsTag}
        <div style="width:7px;height:7px;border-radius:50%;background:${dotClr};flex-shrink:0;${on?'box-shadow:0 0 5px '+sim.color:''}${on?' ':''}"></div>
      </div>
    </div>

    <div class="sv-row mb-2">
      <span class="sv-key">Temp</span> <span class="sv-val" style="color:#34d399">${v.temp.toFixed?v.temp.toFixed(1):v.temp}°C</span>
      <span class="sv-key">Hum</span>  <span class="sv-val" style="color:#6ee7b7">${(+v.hum).toFixed(1)}%</span>
      <span class="sv-key">Dist</span> <span class="sv-val" style="color:#93c5fd">${(+v.dist).toFixed(2)}m</span>
      <span class="sv-key">Speed</span><span class="sv-val" style="color:#a5b4fc">${(+v.speed).toFixed(2)}m/s</span>
      <span class="sv-key">Light</span><span class="sv-val" style="color:#fde68a">${Math.round(v.light)}lux</span>
      <span class="sv-key">Ht</span>   <span class="sv-val" style="color:#fdba74">${Math.round(v.height)}mm</span>
      <span class="sv-key" style="color:#4a1d96">Nrgy</span><span class="sv-val" style="color:#f0abfc">${v.energy}</span>
      <span class="sv-key">CRC</span>  <span class="sv-val" style="color:#fca5a5;font-size:.6rem">${sim.lastCrc||'—'}</span>
    </div>

    <div class="flex justify-between text-xs mb-2" style="color:#334155">
      <span>#${sim.frames} frames</span>
      <span style="color:${on?sim.color:'#334155'}">${on?'↻ every ':''}${sim.interval}ms</span>
    </div>

    <div class="flex gap-1">
      <button type="button" onclick="toggleNode('${sim.id}')" class="btn flex-1" style="background:${btnBg};color:${btnClr}">${btnTxt}</button>
      <button type="button" onclick="nodeSimMap_randomize('${sim.id}')" class="btn" style="background:#1e293b;color:#94a3b8;padding:5px 7px">🎲</button>
      <button type="button" onclick="openModal('${sim.id}')" class="btn" style="background:#1e293b;color:#94a3b8;padding:5px 7px">⚙</button>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════
//  GLOBAL ACTIONS (called from card onclick attributes)
// ═══════════════════════════════════════════════════════════════

function toggleNode(id)              { const s=nodeMap.get(id); if(s) s.active ? s.stop() : s.start(); }
function nodeSimMap_randomize(id)    { const s=nodeMap.get(id); if(s) s.randomize(); }
function startAll()                  { nodeMap.forEach(s => { if(!s.active) s.start(); }); }
function stopAll()                   { nodeMap.forEach(s => { if(s.active)  s.stop();  }); }
function randomizeAll()              { nodeMap.forEach(s => s.randomize()); addLog('All nodes randomized','inf',null); }

function updateStats() {
  const active = [...nodeMap.values()].filter(s => s.active).length;
  const dot    = document.getElementById('statDot');
  dot.style.background = active > 0 ? '#22c55e' : '#475569';
  dot.style.boxShadow  = active > 0 ? `0 0 5px #22c55e` : '';
  if (active > 0) dot.classList.add('pulsing'); else dot.classList.remove('pulsing');
  document.getElementById('statLabel').textContent  = `${active}/${nodeMap.size} active`;
  document.getElementById('statFrames').textContent = totalFrames;
  document.getElementById('statBits').textContent   = `${totalBits} bits`;
}

// ═══════════════════════════════════════════════════════════════
//  BIT STREAM
// ═══════════════════════════════════════════════════════════════

function pushBits(bytes, sim) {
  const ctr  = document.getElementById('bitStream');
  const MAX  = 300;
  const frag = document.createDocumentFragment();

  // colour separator
  const sep = document.createElement('span');
  sep.className    = 'bs-sep';
  sep.style.background = sim.color + '55';
  frag.appendChild(sep);

  for (let i = 0; i < bytes.length; i++) {
    for (let b = 7; b >= 0; b--) {
      const bit  = (bytes[i] >> b) & 1;
      const span = document.createElement('span');
      span.className = 'bs-bit';
      span.textContent = bit;
      span.style.cssText = bit
        ? `background:${sim.color}2a;color:${sim.color}`
        : 'background:#131d2d;color:#1e3a5f';
      frag.appendChild(span);
    }
  }
  ctr.insertBefore(frag, ctr.firstChild);
  while (ctr.children.length > MAX + 15) ctr.removeChild(ctr.lastChild);
  document.getElementById('bsInfo').textContent =
    `${totalBits} bits · last: ${sim.id}`;
}

function clearBs() {
  document.getElementById('bitStream').innerHTML = '';
  document.getElementById('bsInfo').textContent = '';
}

// ═══════════════════════════════════════════════════════════════
//  LOG
// ═══════════════════════════════════════════════════════════════

function addLog(msg, type, color) {
  const ctr = document.getElementById('logContainer');
  const el  = document.createElement('div');
  const now = new Date();
  const ts  = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:`+
               `${now.getSeconds().toString().padStart(2,'0')}.${now.getMilliseconds().toString().padStart(3,'0')}`;
  el.className = 'le';
  el.style.color = color || (type==='ws'?'#60a5fa': type==='http'?'#a78bfa': type==='err'?'#f87171':'#475569');
  el.textContent = `[${ts}] ${msg}`;
  ctr.insertBefore(el, ctr.firstChild);
  while (ctr.children.length > 500) ctr.removeChild(ctr.lastChild);
}

function clearLog() { document.getElementById('logContainer').innerHTML = ''; }

// ═══════════════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════════════

function openModal(id) {
  const sim = nodeMap.get(id);
  if (!sim) return;
  modalId = id;

  document.getElementById('mdlTitle').textContent   = sim.id;
  document.getElementById('mdlTitle').style.color   = sim.color;
  document.getElementById('mdlSub').textContent     = sim.name;
  document.getElementById('mdlInterval').value      = sim.interval;

  syncModalFull();
  document.getElementById('editModal').classList.add('open');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  modalId = null;
}

function syncModalFull() {
  const sim = nodeMap.get(modalId);
  if (!sim) return;

  // Toggle btn
  const btn = document.getElementById('mdlToggleBtn');
  btn.textContent = sim.active ? '■ Stop' : '▶ Start';
  btn.style.background = sim.active ? '#7f1d1d' : '#1d4ed8';
  btn.style.color      = sim.active ? '#fca5a5' : '#fff';

  // Status dot
  const dot = document.getElementById('mdlDot');
  dot.style.background = sim.active ? sim.color : '#475569';
  dot.style.boxShadow  = sim.active ? `0 0 5px ${sim.color}` : '';

  buildModalSliders(sim);
  buildModalFrame(sim);
}

function syncModalValues() {
  const sim = nodeMap.get(modalId);
  if (!sim) return;
  // Only update value displays without rebuilding all sliders
  SEN_DEFS.forEach(sd => {
    const disp = document.getElementById(`mdisp-${sd.id}`);
    if (!disp) return;
    const v = sim.values[sd.id];
    disp.textContent = sd.int ? Math.round(v) : (+v).toFixed(sd.step < 0.1 ? 2 : 1);
  });
  buildModalFrame(sim);
}

function buildModalSliders(sim) {
  const ctr = document.getElementById('mdlSliders');
  ctr.innerHTML = '';
  SEN_DEFS.forEach(sd => {
    const v = sim.values[sd.id];
    const d = sd.int ? Math.round(v) : (+v).toFixed(sd.step < 0.1 ? 2 : 1);
    const wrap = document.createElement('div');
    wrap.className = 'space-y-0.5';
    wrap.innerHTML = `
      <div class="flex justify-between">
        <label class="text-xs text-slate-400">${sd.lbl}${sd.unit?' ('+sd.unit+')':''}</label>
        <span id="mdisp-${sd.id}" class="text-xs font-bold font-mono text-white">${d}</span>
      </div>
      <input type="range" min="${sd.min}" max="${sd.max}" step="${sd.step}" value="${v}" class="w-full"
             oninput="mdlSlide('${sd.id}',this.value)"/>
      <input type="number" id="mnum-${sd.id}" min="${sd.min}" max="${sd.max}" step="${sd.step}" value="${v}"
             class="ci w-full" oninput="mdlNum('${sd.id}',this.value)"/>
    `;
    ctr.appendChild(wrap);
  });
}

function mdlSlide(fid, val) {
  const sim = nodeMap.get(modalId); if(!sim) return;
  const sd  = SEN_DEFS.find(f => f.id === fid);
  sim.values[fid] = sd.int ? parseInt(val) : parseFloat(val);
  const num = document.getElementById('mnum-'+fid);
  if(num) num.value = val;
  const d = document.getElementById('mdisp-'+fid);
  if(d) d.textContent = sd.int ? Math.round(val) : (+val).toFixed(sd.step<0.1?2:1);
  buildModalFrame(sim);
}

function mdlNum(fid, val) {
  const sim = nodeMap.get(modalId); if(!sim) return;
  const sd  = SEN_DEFS.find(f => f.id === fid);
  sim.values[fid] = sd.int ? parseInt(val) : parseFloat(val);
  const d = document.getElementById('mdisp-'+fid);
  if(d) d.textContent = sd.int ? Math.round(val) : (+val).toFixed(sd.step<0.1?2:1);
  // sync range slider
  const sliders = document.querySelectorAll('#mdlSliders input[type="range"]');
  const idx = SEN_DEFS.findIndex(f => f.id === fid);
  if(sliders[idx]) sliders[idx].value = val;
  buildModalFrame(sim);
}

function updateModalInterval(val) {
  const sim = nodeMap.get(modalId); if(!sim) return;
  sim.interval = parseInt(val) || 1000;
  // New interval takes effect automatically at the next _loop() tick
  redrawCard(sim);
}

function toggleModalNode() {
  const sim = nodeMap.get(modalId); if(!sim) return;
  if (sim.active) sim.stop(); else sim.start();
  syncModalFull();
}

function randomizeModalNode() {
  const sim = nodeMap.get(modalId); if(!sim) return;
  sim.randomize();
  syncModalFull();
}

// ═══════════════════════════════════════════════════════════════
//  MODAL FRAME TABLE (32-byte preview)
// ═══════════════════════════════════════════════════════════════

function buildModalFrame(sim) {
  const tbl   = document.getElementById('mdlFT');
  const frame = sim.buildFrame();

  if (!mdlFTBuilt) {
    tbl.innerHTML = '';
    const r1 = tbl.insertRow(); // field labels
    const r2 = tbl.insertRow(); // hex
    const r3 = tbl.insertRow(); // binary

    FIELDS.forEach(f => {
      const td = document.createElement('td');
      td.colSpan = f.l;
      td.className = 'ft-f';
      td.style.cssText = `background:${f.bg};color:${f.fg}`;
      td.textContent   = f.lbl;
      r1.appendChild(td);
    });

    for (let i = 0; i < 32; i++) {
      const f  = BYTE_FIELD[i];
      const h  = r2.insertCell();
      h.id     = `mfth-${i}`;
      h.className = 'ft-h';
      h.style.cssText = `background:${f.bg};color:${f.fg}`;

      const b  = r3.insertCell();
      b.id     = `mftb-${i}`;
      b.className = 'ft-b';
      b.style.cssText = `background:${f.bg}`;
    }
    mdlFTBuilt = true;
  }

  for (let i = 0; i < 32; i++) {
    const hEl = document.getElementById(`mfth-${i}`);
    const bEl = document.getElementById(`mftb-${i}`);
    if (hEl) hEl.textContent = frame[i].toString(16).toUpperCase().padStart(2,'0');
    if (bEl) bEl.innerHTML   = frame[i].toString(2).padStart(8,'0').split('').map(ch =>
      `<span style="color:${ch==='1'?'#86efac':'#1e3a5f'}">${ch}</span>`
    ).join('');
  }
}

  localStorage.setItem('sim-backend-host', backendHost);
  localStorage.setItem('sim-mode',         document.getElementById('sel-mode').value);
  localStorage.setItem('sim-interval',     document.getElementById('inp-interval').value);
});

  // Sync inp-host to reflect JS variable (already initialized from localStorage at top)
  document.getElementById('inp-host').value = backendHost;

  const savedMode = localStorage.getItem('sim-mode');
  if (savedMode) document.getElementById('sel-mode').value = savedMode;

  const savedInterval = localStorage.getItem('sim-interval');
  if (savedInterval) document.getElementById('inp-interval').value = savedInterval;

  addLog('Multi-Node Frame Simulator ready', 'inf', null);
  addLog('Frame: 32B  AA|01|TEMP[4]|HUM[4]|LIGHT[4]|DIST[4]|SPEED[4]|ENERGY[4]|HEIGHT[2]|CRC[2]|00|BB', 'inf', null);
  addLog('WS mode: one connection per node to /ws/device?nodeId=…', 'inf', null);
  addLog('HTTP mode: POST /api/sensors/{nodeId}-{SENSOR}/measurements', 'inf', null);
  addLog('→ Click "Fetch" or "Defaults" to load nodes', 'inf', null);
});
