<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Bản đồ tuyến cống</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="libs/maplibre-gl.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b1121;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* --- DARK POPUP (Mặc định) --- */
        .maplibregl-popup-content {
            background-color: #1e293b;
            color: #e2e8f0;
            font-family: system-ui, sans-serif;
            font-size: 13px;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            max-width: 350px !important;
        }

        .maplibregl-popup-close-button {
            color: #94a3b8;
            font-size: 18px;
            padding: 4px;
        }

            .maplibregl-popup-close-button:hover {
                background-color: transparent;
                color: #f1f5f9;
            }

        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
            border-top-color: #1e293b;
        }

        .maplibregl-popup-anchor-top .maplibregl-popup-tip {
            border-bottom-color: #1e293b;
        }

        .maplibregl-popup-anchor-left .maplibregl-popup-tip {
            border-right-color: #1e293b;
        }

        .maplibregl-popup-anchor-right .maplibregl-popup-tip {
            border-left-color: #1e293b;
        }

        /* --- LIGHT POPUP (Sẽ kích hoạt khi body có class 'light-theme') --- */
        body.light-theme {
            background-color: #f8fafc;
        }

            body.light-theme .maplibregl-popup-content {
                background-color: #ffffff;
                color: #1e293b;
                border: 1px solid #e2e8f0;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

            body.light-theme .maplibregl-popup-close-button {
                color: #64748b;
            }

                body.light-theme .maplibregl-popup-close-button:hover {
                    color: #0f172a;
                }

            body.light-theme .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
                border-top-color: #ffffff;
            }

            body.light-theme .maplibregl-popup-anchor-top .maplibregl-popup-tip {
                border-bottom-color: #ffffff;
            }

            body.light-theme .maplibregl-popup-anchor-left .maplibregl-popup-tip {
                border-right-color: #ffffff;
            }

            body.light-theme .maplibregl-popup-anchor-right .maplibregl-popup-tip {
                border-left-color: #ffffff;
            }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="libs/maplibre-gl.js"></script>
    <script src="libs/pmtiles.js"></script>

    <script>
        let backendBaseUrl = "";
        let stationId = "";
        let mapInitialized = false;
        let currentTheme = "Dark";
        let sensorsGeoJson = null;

        function sendMessage(obj) {
            try {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify(obj));
                }
            } catch (e) { console.error("sendMessage error", e); }
        }

        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                const msg = event.data;
                if (msg.type === "init") {
                    backendBaseUrl = msg.backend;
                    stationId = msg.station;
                    initMap();
                }
                if (msg.type === "refresh-data" && mapInitialized) {
                    loadSensors(); loadRoutes();
                }
            });
        }

        function initMap() {
            if (mapInitialized) return;
            mapInitialized = true;

            let protocol = new pmtiles.Protocol();
            maplibregl.addProtocol("pmtiles", protocol.tile);

            // Khởi tạo bản đồ với file Dark JSON mặc định
            window.map = new maplibregl.Map({
                container: 'map',
                center: [105.7940, 21.0370],
                zoom: 15,
                minZoom: 5,
                maxZoom: 18,
                style: 'style_dark.json' // <--- ĐỌC TỪ FILE JSON THAY VÌ CODE CỨNG
            });

            map.addControl(new maplibregl.NavigationControl(), 'top-left');
            map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

            map.on('load', () => {
                loadSensors();
                loadRoutes();
                sendMessage({ type: "mapready" });
            });
        }

        async function loadSensors() {
            try {
                const geojson = {
                    "type": "FeatureCollection",
                    "features": [
                        { "type": "Feature", "geometry": { "type": "Point", "coordinates": [105.7940, 21.0370] }, "properties": { "id": "hub-01", "name": "Trạm Trung Tâm", "code": "HUB", "isHub": true, "status": "Online", "batteryLevel": 98, "rssi": -65, "sensorCount": 5, "line": "Trạm điều khiển chính" } },
                        { "type": "Feature", "geometry": { "type": "Point", "coordinates": [105.7965, 21.0385] }, "properties": { "id": "node-01", "name": "Hố ga Hoàng Quốc Việt 1", "code": "HQV-01", "isHub": false, "status": "Online", "batteryLevel": 85, "rssi": -72, "sensorCount": 2, "cameraId": "CAM-001", "line": "Tuyến HQV" } },
                        { "type": "Feature", "geometry": { "type": "Point", "coordinates": [105.7980, 21.0395] }, "properties": { "id": "node-02", "name": "Hố ga Hoàng Quốc Việt 2", "code": "HQV-02", "isHub": false, "status": "Warning", "batteryLevel": 60, "rssi": -80, "sensorCount": 3, "line": "Tuyến HQV" } },
                        { "type": "Feature", "geometry": { "type": "Point", "coordinates": [105.7920, 21.0360] }, "properties": { "id": "node-03", "name": "Hố ga Nguyễn Phong Sắc", "code": "NPS-01", "isHub": false, "status": "Critical", "batteryLevel": 20, "rssi": -95, "sensorCount": 1, "line": "Tuyến NPS" } },
                        { "type": "Feature", "geometry": { "type": "Point", "coordinates": [105.7910, 21.0350] }, "properties": { "id": "node-04", "name": "Hố ga Trần Đăng Ninh", "code": "TDN-01", "isHub": false, "status": "Offline", "batteryLevel": 0, "rssi": -110, "sensorCount": 0, "cameraId": "CAM-002", "line": "Tuyến TDN" } }
                    ]
                };

                sensorsGeoJson = geojson;

                if (map.getSource('sensors')) {
                    map.getSource('sensors').setData(geojson);
                } else {
                    map.addSource('sensors', { type: 'geojson', data: geojson });
                    setupSensorLayers();
                    setupSensorInteractions();
                }
            } catch (e) { console.error("Error loading sensors:", e); }
        }

        function setupSensorLayers() {
            map.addLayer({ id: 'sensors-circle', type: 'circle', source: 'sensors', filter: ['!=', ['get', 'isHub'], true], paint: { 'circle-color': ['match', ['get', 'status'], 'Online', '#10B981', 'Warning', '#F59E0B', 'Critical', '#EF4444', 'Offline', '#6B7280', '#94A3B8'], 'circle-radius': 8, 'circle-stroke-color': '#0f172a', 'circle-stroke-width': 2 } });
            map.addLayer({ id: 'station-outer-ring', type: 'circle', source: 'sensors', filter: ['==', ['get', 'isHub'], true], paint: { 'circle-color': '#3B82F6', 'circle-radius': 18, 'circle-opacity': 0.3 } });
            map.addLayer({ id: 'station-circle', type: 'circle', source: 'sensors', filter: ['==', ['get', 'isHub'], true], paint: { 'circle-color': '#3B82F6', 'circle-radius': 12, 'circle-stroke-color': '#ffffff', 'circle-stroke-width': 3 } });
            map.addLayer({ id: 'station-label', type: 'symbol', source: 'sensors', filter: ['==', ['get', 'isHub'], true], layout: { 'text-field': ['get', 'name'], 'text-font': ['Noto Sans Bold'], 'text-size': 13, 'text-variable-anchor': ['top', 'bottom', 'left', 'right'], 'text-radial-offset': 1.8 }, paint: { 'text-color': '#ffffff', 'text-halo-color': '#0b1121', 'text-halo-width': 2 } });
            map.addLayer({ id: 'relay-label', type: 'symbol', source: 'sensors', filter: ['!=', ['get', 'isHub'], true], layout: { 'text-field': ['get', 'code'], 'text-font': ['Noto Sans Semibold'], 'text-size': 11, 'text-offset': [0, 1.8], 'text-anchor': 'top' }, paint: { 'text-color': '#cbd5e1', 'text-halo-color': '#0b1121', 'text-halo-width': 2 } });
        }

        function setupSensorInteractions() {
            const popupLayers = ['sensors-circle', 'station-circle'];
            map.on('click', popupLayers, async (e) => {
                const p = e.features[0].properties;
                const coords = e.features[0].geometry.coordinates.slice();
                while (Math.abs(e.lngLat.lng - coords[0]) > 180) { coords[0] += e.lngLat.lng > coords[0] ? 360 : -360; }
                const popupContent = document.createElement('div');
                buildPopupHTML(popupContent, p);
                new maplibregl.Popup({ closeOnClick: true, maxWidth: '380px' }).setLngLat(coords).setDOMContent(popupContent).addTo(map);
                loadSensorDetailsForPopup(p.id, p.isHub);
            });
            map.on('mouseenter', popupLayers, () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', popupLayers, () => { map.getCanvas().style.cursor = ''; });
        }

        function buildPopupHTML(container, p) {
            const statusColors = { 'Online': '#10B981', 'Warning': '#F59E0B', 'Critical': '#EF4444', 'Offline': '#6B7280' };
            const statusColor = statusColors[p.status] || '#94A3B8';
            const hubIcon = p.isHub ? '🏢 ' : '';
            const hubStyle = p.isHub ? 'color: #60a5fa; font-weight: bold;' : 'color: #94a3b8;';
            container.innerHTML = `<div style="border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 8px;"><div style="font-size: 15px; font-weight: bold; color: #f1f5f9;">${hubIcon}${p.name}</div><div style="font-size: 12px; ${hubStyle}">${p.code} • ${p.line || 'N/A'}</div></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px; margin-bottom: 10px;"><div><span style="color: #94a3b8;">Trạng thái:</span> <strong style="color: ${statusColor};">● ${p.status}</strong></div><div><span style="color: #94a3b8;">Pin:</span> <strong style="color: #f1f5f9;">${p.batteryLevel}%</strong></div><div><span style="color: #94a3b8;">RSSI:</span> <strong style="color: #f1f5f9;">${p.rssi} dBm</strong></div><div><span style="color: #94a3b8;">Sensors:</span> <strong style="color: #f1f5f9;">${p.sensorCount}</strong></div></div><div id="sensors-section-${p.id}" style="border-top: 1px solid #334155; padding-top: 8px; margin-top: 8px;"><div style="font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px;">📊 Cảm biến <span id="sensors-loading-${p.id}" style="font-weight: normal; color: #64748b;">(đang tải...)</span></div><div id="sensors-list-${p.id}" style="max-height: 180px; overflow-y: auto;"></div></div><div style="margin-top: 12px; display: flex; gap: 8px;">${p.cameraId ? `<button onclick="window.onViewCamera('${p.cameraId}','${p.id}')" style="flex: 1; padding: 6px 10px; background-color: #10B981; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">📹 Camera</button>` : ''}<button onclick="window.onManageDevice('${p.id}')" style="flex: 1; padding: 6px 10px; background-color: #3B82F6; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">⚙️ Quản lý</button></div>`;
        }

        async function loadSensorDetailsForPopup(nodeId, isHub) {
            try {
                const loadingEl = document.getElementById(`sensors-loading-${nodeId}`);
                const listEl = document.getElementById(`sensors-list-${nodeId}`);
                if (loadingEl) loadingEl.style.display = 'none';
                if (listEl) {
                    const sensors = [
                        { name: 'Nhiệt độ', type: 'Temperature', currentValue: 28.5, unit: '°C', warningThreshold: 40, criticalThreshold: 50 },
                        { name: 'Độ ẩm', type: 'Humidity', currentValue: 75, unit: '%', warningThreshold: 85, criticalThreshold: 95 },
                        { name: 'Khí độc H2S', type: 'Gas', currentValue: 12, unit: 'ppm', warningThreshold: 10, criticalThreshold: 20 }
                    ];
                    listEl.innerHTML = sensors.map(s => renderSensorItem(s)).join('');
                }
            } catch (err) { console.error('Failed details:', err); }
        }

        function renderSensorItem(s) {
            const isWarning = s.currentValue >= s.warningThreshold; const isCritical = s.currentValue >= s.criticalThreshold; const sensorColor = isCritical ? '#ef4444' : (isWarning ? '#f59e0b' : '#10B981'); const sensorIcon = getSensorIcon(s.type);
            return `<div style="display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; margin-bottom: 4px; background-color: #334155; border-radius: 4px; font-size: 12px;"><div style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 14px;">${sensorIcon}</span><span style="color: #cbd5e1;">${s.name}</span></div><div style="display: flex; align-items: center; gap: 4px;"><span style="font-weight: 600; color: ${sensorColor};">${s.currentValue?.toFixed(1) || 'N/A'}</span><span style="color: #94a3b8;">${s.unit}</span></div></div>`;
        }

        function getSensorIcon(type) {
            const icons = { 'Radar': '📡', 'Vibration': '〰️', 'Temperature': '🌡️', 'Humidity': '💧', 'SmokeFire': '🔥', 'Gas': '💨', 'Pressure': '🎯', 'WaterLevel': '🌊', 'Motion': '🏃' };
            return icons[type] || '📊';
        }

        async function loadRoutes() {
            try {
                const geojson = {
                    "type": "FeatureCollection",
                    "features": [
                        { "type": "Feature", "geometry": { "type": "LineString", "coordinates": [[105.7940, 21.0370], [105.7965, 21.0385], [105.7980, 21.0395]] }, "properties": { "Status": "active" } },
                        { "type": "Feature", "geometry": { "type": "LineString", "coordinates": [[105.7940, 21.0370], [105.7920, 21.0360], [105.7910, 21.0350]] }, "properties": { "Status": "critical" } }
                    ]
                };
                if (map.getSource('routes')) { map.getSource('routes').setData(geojson); } else {
                    map.addSource('routes', { type: 'geojson', data: geojson });
                    map.addLayer({ id: 'routes-line', type: 'line', source: 'routes', layout: { 'line-join': 'round', 'line-cap': 'round' }, paint: { 'line-color': ['match', ['get', 'Status'], 'active', '#10B981', 'warning', '#f59e0b', 'critical', '#ef4444', '#94a3b8'], 'line-width': 4, 'line-opacity': 0.8 } });
                }
            } catch (e) { console.error("Error routes:", e); }
        }

        window.onViewCamera = function (cameraId, nodeId) { sendMessage({ type: "viewcamera", cameraId: cameraId, nodeId: nodeId }); };
        window.onManageDevice = function (nodeId) { sendMessage({ type: "managedevice", nodeId: nodeId }); };

        // -------- HỖ TRỢ UPDATE NODE TỪ C# --------
        window.updateNode = function (node) {
            try {
                if (!sensorsGeoJson || !node || !node.id) return;

                const features = sensorsGeoJson.features || [];
                const idx = features.findIndex(f => f.properties && f.properties.id === node.id);

                if (idx >= 0) {
                    // Merge properties
                    Object.assign(features[idx].properties, node);
                } else {
                    console.log("updateNode: id not found in sensorsGeoJson", node.id);
                    return;
                }

                if (map && map.getSource('sensors')) {
                    map.getSource('sensors').setData(sensorsGeoJson);
                }
            } catch (e) {
                console.error("updateNode error", e);
            }
        };

        window.updateNodes = function (nodes) {
            try {
                if (!Array.isArray(nodes)) return;

                let isUpdated = false;
                nodes.forEach(node => {
                    if (!sensorsGeoJson || !node || !node.id) return;
                    const features = sensorsGeoJson.features || [];
                    const idx = features.findIndex(f => f.properties && f.properties.id === node.id);

                    if (idx >= 0) {
                        Object.assign(features[idx].properties, node);
                        isUpdated = true;
                    }
                });

                if (isUpdated && map && map.getSource('sensors')) {
                    map.getSource('sensors').setData(sensorsGeoJson);
                }
            } catch (e) {
                console.error("updateNodes error", e);
            }
        };

        // -------- HỖ TRỢ THEME TỪ C# --------
        function setTheme(theme) {
            currentTheme = theme || "Dark";

            // 1. Đổi class CSS của body để đổi màu nền và màu Popup
            if (currentTheme === "Light") {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }

            // 2. Cập nhật lại bản đồ nền
            if (window.map) {
                const styleFile = currentTheme === "Light" ? 'style_light.json' : 'style_dark.json';

                window.map.setStyle(styleFile);

                // QUAN TRỌNG: Khi đổi Style, MapLibre sẽ xóa mất các layer ống cống và hố ga.
                // Chúng ta phải đợi Style load xong rồi vẽ lại chúng.
                window.map.once('style.load', () => {
                    loadSensors();
                    loadRoutes();
                });
            }

            console.log("Theme changed to:", currentTheme);
        }

        window.setTheme = setTheme;
    </script>
</body>

</html>
